{% extends 'shop/base.html' %}
{% block content %}
<div class="py-20 max-w-md mx-auto text-center">
    <h1 class="text-2xl font-black mb-4">Удалить товар?</h1>
    <p class="text-muted-foreground mb-8">«{{ product.name }}» будет удалён безвозвратно вместе со всеми фотографиями.</p>
    <div class="flex gap-4 justify-center">
        <a href="{% url 'shop:admin_product_list' %}" class="px-6 py-2.5 border border-border rounded-md text-sm font-medium hover:bg-muted transition-colors">Отмена</a>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="px-6 py-2.5 bg-red-600 text-white rounded-md text-sm font-bold hover:bg-red-700 transition-colors">Удалить</button>
        </form>
    </div>
</div>
{% endblock %}
