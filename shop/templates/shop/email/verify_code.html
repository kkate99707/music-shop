<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: 'Inter', sans-serif; max-width: 500px; margin: 0 auto; padding: 40px; border: 1px solid #e5e7eb; border-radius: 8px; }
        .logo { font-size: 24px; font-weight: bold; color: #000; text-transform: uppercase; margin-bottom: 30px; text-align: center; }
        .title { font-size: 20px; font-weight: 600; color: #111827; margin-bottom: 16px; text-align: center; }
        .text { color: #4b5563; line-height: 1.5; margin-bottom: 30px; text-align: center; }
        .code-container { background-color: #f3f4f6; padding: 20px; border-radius: 12px; text-align: center; letter-spacing: 10px; }
        .code { font-size: 32px; font-weight: 800; color: #000; }
        .footer { margin-top: 30px; font-size: 12px; color: #9ca3af; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">MUSIC.SHOP</div>
        <div class="title">Подтверждение почты</div>
        <p class="text">Вы получили это письмо, потому что регистрируетесь в MUSIC.SHOP. Пожалуйста, используйте код ниже, чтобы завершить процесс:</p>
        
        <div class="code-container">
            <span class="code">{{ code }}</span>
        </div>

        <p class="text" style="margin-top: 30px; font-size: 13px;">Код действителен в течение 10 минут.</p>
        
        <div class="footer">
            Если вы не запрашивали это письмо, просто проигнорируйте его.<br>
            © 2026 MUSIC.SHOP
        </div>
    </div>
</body>
</html>
