{% extends 'shop/base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-12 max-w-xl">
    <h1 class="text-3xl font-black uppercase tracking-tighter mb-8">Новый адрес</h1>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="grid grid-cols-1 gap-4">
            {% for field in form %}
                <div>
                    <label class="text-[10px] font-black text-gray-400">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-[10px] font-bold mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        
        <div class="pt-6">
            <button type="submit" class="w-full bg-black text-white py-4 text-xs font-black uppercase hover:bg-gray-800 transition-all">
                Добавить адрес
            </button>
        </div>
    </form>
</div>
{% endblock %}
