{% extends 'shop/base.html' %}

{% block content %}
<div class="max-w-md mx-auto py-24">
    <div class="bg-card border border-border p-8 shadow-lg">
        <h2 class="text-3xl font-bold mb-2 text-center text-foreground">Вход</h2>
        <p class="text-muted-foreground text-center mb-8 text-sm">Добро пожаловать в MUSIC.SHOP</p>
        
        <form method="POST" action="{% url 'login' %}" class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div class="flex flex-col gap-1">
                    <label class="text-sm font-medium">Логин</label>
                    <input type="text" name="username" required 
                           class="w-full bg-background border border-border p-2 rounded-md focus:ring-2 focus:ring-accent outline-none">
                </div>
                
                <div class="flex flex-col gap-1">
                    <label class="text-sm font-medium">Пароль</label>
                    <div class="relative">
                        <input type="password" name="password" id="id_password" required 
                               class="w-full bg-background border border-border p-2 pr-10 rounded-md focus:ring-2 focus:ring-accent outline-none">
                        
                        <button type="button" 
                                onclick="togglePass('id_password', this)"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-primary transition-colors focus:outline-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            {% if form.errors %}
                <p class="text-xs text-destructive text-center font-medium">Неверный логин или пароль</p>
            {% endif %}

            <button type="submit" class="w-full bg-primary text-primary-foreground py-4 rounded-md font-semibold hover:bg-accent transition-all active:scale-[0.98] mt-4">
                Войти в систему
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <span class="text-muted-foreground">Впервые у нас?</span>
            <a href="{% url 'shop:register' %}" class="text-foreground font-bold underline hover:text-accent ml-1 transition-colors">Создать аккаунт</a>
        </div>
    </div>
</div>

<script>
function togglePass(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('svg');
    
    if (input.type === 'password') {
        input.type = 'text';
        // Иконка "перечеркнутый глаз"
        icon.innerHTML = '<path d="M9.88 9.88L12 12m.12 2.12L12 12m4.24-4.24L17 7m-10 10l-1 1m0-12s3-2 10-2 10 7 10 7-3 7-10 7-10-7-10-7zM3 3l18 18"/>';
    } else {
        input.type = 'password';
        // Обычный глаз
        icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    }
}
</script>
{% endblock %}
